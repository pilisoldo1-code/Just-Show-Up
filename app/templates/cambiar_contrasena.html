<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just Show Up - Cambiar contraseña</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <main>
        {% include "_menu.html" %}
        <h1>Cambiar contraseña</h1>
        <p class="subtitle">La nueva contraseña debe tener al menos 8 caracteres.</p>

        {% if aviso %}
        <div class="aviso {{ 'aviso-ok' if aviso_ok else 'aviso-error' }}">{{ aviso }}</div>
        {% endif %}

        <form action="/cuenta/contrasena" method="post" class="horario-form">
            <label>
                Contraseña actual
                <input type="password" name="actual" autocomplete="current-password" required />
            </label>
            <label>
                Contraseña nueva
                <input type="password" name="nueva" autocomplete="new-password" minlength="8" required />
            </label>
            <label>
                Repetir contraseña nueva
                <input type="password" name="repetir" autocomplete="new-password" minlength="8" required />
            </label>
            <button type="submit" class="btn">Guardar contraseña</button>
        </form>
    </main>
</body>
</html>
