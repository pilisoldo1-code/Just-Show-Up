<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just Show Up - Panel de administración</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    {% include "_menu.html" %}
    <main class="ancho">
        {% if aviso %}
        <div class="aviso {{ 'aviso-ok' if aviso_ok else 'aviso-error' }}">{{ aviso }}</div>
        {% endif %}
        <h1>Panel de administración</h1>
        <p class="subtitle">{{ usuario.empresa_nombre or 'Tu lugar' }}</p>

        <div class="panel-numeros">
            <div>
                <span class="panel-numero">{{ resumen.alumnas }}</span>
                <span>Alumnas activas</span>
            </div>
            <div>
                <span class="panel-numero">{{ resumen.profesoras }}</span>
                <span>Profesoras activas</span>
            </div>
            <div>
                <span class="panel-numero">{{ resumen.clases_semanales }}</span>
                <span>Clases semanales activas</span>
            </div>
        </div>
    </main>
</body>
</html>
