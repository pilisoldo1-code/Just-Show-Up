<nav class="menu">
    <div class="menu-links">
        {% if usuario.es_profesora %}
        <a href="/profesora/horarios">Horarios</a>
        <a href="/profesora/alumnas">Alumnas</a>
        {% else %}
        <a href="/">Clases</a>
        {% endif %}
    </div>
    <div class="menu-cuenta">
        {% if usuario.es_prueba %}
        <form action="/alumna/elegir" method="post" class="alumna-selector">
            <input type="hidden" name="semana" value="{{ semana }}" />
            <input type="hidden" name="fecha" value="{{ fecha }}" />
            <label>
                Alumna (prueba)
                <select name="alumna_id" onchange="this.form.submit()">
                    {% for id, nombre in alumnas.items() %}
                    <option value="{{ id }}" {{ 'selected' if id == alumna_id else '' }}>{{ nombre }}</option>
                    {% endfor %}
                </select>
            </label>
        </form>
        {% else %}
        <span class="menu-nombre">{{ usuario.nombre }} {{ usuario.apellido }}</span>
        <a href="/cuenta/contrasena">Cambiar contraseña</a>
        {% endif %}
        <form action="/logout" method="post">
            <button type="submit" class="link-btn">Cerrar sesión</button>
        </form>
    </div>
</nav>
