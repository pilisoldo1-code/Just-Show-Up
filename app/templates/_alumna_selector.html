<form action="/alumna/elegir" method="post" class="alumna-selector">
    <input type="hidden" name="semana" value="{{ semana }}" />
    <input type="hidden" name="fecha" value="{{ fecha }}" />
    <label>
        Alumna (prueba)
        <select name="alumna_id" onchange="this.form.submit()">
            {% for id, nombre in alumnas.items() %}
            <option value="{{ id }}" {{ 'selected' if id == alumna_id else '' }}>{{ nombre }}</option>
            {% endfor %}
        </select>
    </label>
</form>
